# Soccer Analytics Visualization - Configuration
# Edit these settings to customize your visualizations

[paths]
output_images = output/images
output_videos = output/videos
output_gifs = output/gifs

[instagram]
# Instagram optimal dimensions
post_width = 1080
post_height = 1080
story_width = 1080
story_height = 1920
reel_width = 1080
reel_height = 1920

# Video settings
fps = 30
max_duration_seconds = 60

[visualization]
# Default pitch settings
pitch_type = statsbomb
pitch_color = grass
line_color = white

# Color schemes (can be customized per team)
home_color = #e41a1c
away_color = #377eb8
ball_color = #ffffff

# Font settings
title_fontsize = 16
label_fontsize = 12
font_family = DejaVu Sans

[animation]
# Animation defaults
default_fps = 25
gif_fps = 15
default_duration = 10

# Trail settings (for player movement)
trail_length = 10
trail_alpha = 0.3

[statsbomb]
# Competitions to focus on (IDs from StatsBomb)
# 43 = FIFA World Cup
# 11 = La Liga
# 2 = Premier League
default_competitions = 43, 11, 2
