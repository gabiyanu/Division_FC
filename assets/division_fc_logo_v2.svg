<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="crestBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#151C24"/>
      <stop offset="100%" style="stop-color:#0A0E12"/>
    </linearGradient>
    <linearGradient id="neonGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFAA"/>
      <stop offset="33%" style="stop-color:#00D4FF"/>
      <stop offset="66%" style="stop-color:#AA55FF"/>
      <stop offset="100%" style="stop-color:#FF55AA"/>
    </linearGradient>
    <filter id="cyanGlow2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#00FFDD" flood-opacity="0.8"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="magentaGlow2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#FF55AA" flood-opacity="0.8"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Arsenal-style pointed shield -->
  <path d="M200 10 
           L375 60 
           L375 295 
           L200 470 
           L25 295 
           L25 60 Z" 
        fill="url(#crestBg2)" 
        stroke="url(#neonGrad2)" 
        stroke-width="4"/>
  
  <!-- Inner accent line -->
  <path d="M200 30 
           L355 75 
           L355 285 
           L200 445 
           L45 285 
           L45 75 Z" 
        fill="none" 
        stroke="#1A2530" 
        stroke-width="2"/>
  
  <!-- Top section divider -->
  <line x1="45" y1="100" x2="355" y2="100" stroke="#00FFDD" stroke-width="1" opacity="0.5"/>
  
  <!-- DIVISION text at top -->
  <text x="200" y="80" 
        text-anchor="middle" 
        font-family="Arial Black, sans-serif" 
        font-size="32" 
        font-weight="900"
        letter-spacing="2"
        fill="#00FFDD"
        filter="url(#textGlow2)">DIVISION</text>
  
  <!-- TOP EYE - Geometric style -->
  <g transform="translate(200, 158)">
    <path d="M-60 0 Q0 -38 60 0 Q0 38 -60 0" fill="none" stroke="#00FFDD" stroke-width="5" filter="url(#cyanGlow2)"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#00FFDD" stroke-width="3"/>
    <circle cx="0" cy="0" r="11" fill="#00FFDD"/>
    <circle cx="-4" cy="-4" r="3" fill="#FFFFFF"/>
  </g>
  
  <!-- DIVISION BAR -->
  <rect x="70" y="228" width="260" height="14" rx="7" fill="url(#neonGrad2)"/>
  <rect x="90" y="232" width="220" height="6" rx="3" fill="#FFFFFF" opacity="0.4"/>
  
  <!-- BOTTOM EYE - Geometric style -->
  <g transform="translate(200, 302)">
    <path d="M-60 0 Q0 -38 60 0 Q0 38 -60 0" fill="none" stroke="#FF55AA" stroke-width="5" filter="url(#magentaGlow2)"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#FF55AA" stroke-width="3"/>
    <circle cx="0" cy="0" r="11" fill="#FF55AA"/>
    <circle cx="-4" cy="-4" r="3" fill="#FFFFFF"/>
  </g>
  
  <!-- FC text -->
  <text x="200" y="372" 
        text-anchor="middle" 
        font-family="Arial Black, sans-serif" 
        font-size="36" 
        font-weight="900"
        letter-spacing="14"
        fill="#FF55AA"
        filter="url(#textGlow2)">FC</text>
  
  <!-- EST 2025 - FULLY INSIDE CREST -->
  <text x="200" y="400" 
        text-anchor="middle" 
        font-family="Arial, sans-serif" 
        font-size="13" 
        font-weight="bold"
        letter-spacing="5"
        fill="#AA55FF">EST. 2025</text>
</svg>
