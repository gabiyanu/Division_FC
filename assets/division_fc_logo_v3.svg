<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="crestBg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2332"/>
      <stop offset="50%" style="stop-color:#0D1420"/>
      <stop offset="100%" style="stop-color:#080C12"/>
    </linearGradient>
    <linearGradient id="brightGold3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFAA00"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
    <linearGradient id="auroraBar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFCC"/>
      <stop offset="25%" style="stop-color:#00DDFF"/>
      <stop offset="50%" style="stop-color:#AA66FF"/>
      <stop offset="75%" style="stop-color:#FF66B2"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <filter id="goldGlow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#FFD700" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyanGlow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#00FFCC" flood-opacity="0.7"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pinkGlow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#FF66B2" flood-opacity="0.7"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Main Arsenal-style crest -->
  <path d="M200 8 
           L378 58 
           L378 300 
           L200 470 
           L22 300 
           L22 58 Z" 
        fill="url(#crestBg3)" 
        stroke="url(#brightGold3)" 
        stroke-width="5"
        filter="url(#shadow3)"/>
  
  <!-- Inner decorative border -->
  <path d="M200 28 
           L358 72 
           L358 290 
           L200 448 
           L42 290 
           L42 72 Z" 
        fill="none" 
        stroke="#2A3545" 
        stroke-width="2"/>
  
  <!-- Top gold banner -->
  <path d="M42 72 L358 72 L358 108 L42 108 Z" fill="url(#brightGold3)" opacity="0.2"/>
  
  <!-- Top decorative triangle -->
  <path d="M200 8 L230 28 L200 48 L170 28 Z" fill="url(#brightGold3)"/>
  
  <!-- DIVISION text at top -->
  <text x="200" y="96" 
        text-anchor="middle" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="30" 
        font-weight="900"
        letter-spacing="2"
        fill="#FFD700"
        filter="url(#goldGlow3)">DIVISION</text>
  
  <!-- Decorative line under text -->
  <line x1="80" y1="108" x2="320" y2="108" stroke="url(#brightGold3)" stroke-width="2"/>
  
  <!-- TOP EYE - All-seeing style with rays -->
  <g transform="translate(200, 162)">
    <g opacity="0.5">
      <line x1="0" y1="-44" x2="0" y2="-56" stroke="#00FFCC" stroke-width="2"/>
      <line x1="-30" y1="-30" x2="-42" y2="-42" stroke="#00FFCC" stroke-width="2"/>
      <line x1="30" y1="-30" x2="42" y2="-42" stroke="#00FFCC" stroke-width="2"/>
      <line x1="-48" y1="0" x2="-60" y2="0" stroke="#00FFCC" stroke-width="2"/>
      <line x1="48" y1="0" x2="60" y2="0" stroke="#00FFCC" stroke-width="2"/>
    </g>
    <ellipse cx="0" cy="0" rx="46" ry="26" fill="#080C12" stroke="#00FFCC" stroke-width="4" filter="url(#cyanGlow3)"/>
    <circle cx="0" cy="0" r="16" fill="#AA66FF" opacity="0.8"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#00FFCC" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#080C12"/>
    <circle cx="-4" cy="-4" r="3" fill="#FFFFFF"/>
    <circle cx="4" cy="2" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  </g>
  
  <!-- CENTER DIVISION BAR -->
  <rect x="65" y="228" width="270" height="16" rx="8" fill="url(#auroraBar3)"/>
  <rect x="80" y="232" width="240" height="8" rx="4" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="65" cy="236" r="9" fill="#00FFCC" filter="url(#cyanGlow3)"/>
  <circle cx="335" cy="236" r="9" fill="#FF66B2" filter="url(#pinkGlow3)"/>
  
  <!-- BOTTOM EYE - All-seeing style with rays -->
  <g transform="translate(200, 305)">
    <g opacity="0.5">
      <line x1="0" y1="44" x2="0" y2="56" stroke="#FF66B2" stroke-width="2"/>
      <line x1="-30" y1="30" x2="-42" y2="42" stroke="#FF66B2" stroke-width="2"/>
      <line x1="30" y1="30" x2="42" y2="42" stroke="#FF66B2" stroke-width="2"/>
      <line x1="-48" y1="0" x2="-60" y2="0" stroke="#FF66B2" stroke-width="2"/>
      <line x1="48" y1="0" x2="60" y2="0" stroke="#FF66B2" stroke-width="2"/>
    </g>
    <ellipse cx="0" cy="0" rx="46" ry="26" fill="#080C12" stroke="#FF66B2" stroke-width="4" filter="url(#pinkGlow3)"/>
    <circle cx="0" cy="0" r="16" fill="#AA66FF" opacity="0.8"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#FF66B2" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#080C12"/>
    <circle cx="-4" cy="-4" r="3" fill="#FFFFFF"/>
    <circle cx="4" cy="2" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  </g>
  
  <!-- FC in gold -->
  <text x="200" y="378" 
        text-anchor="middle" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="34" 
        font-weight="900"
        letter-spacing="16"
        fill="url(#brightGold3)"
        filter="url(#goldGlow3)">FC</text>
  
  <!-- EST 2025 - FULLY INSIDE CREST -->
  <text x="200" y="405" 
        text-anchor="middle" 
        font-family="Arial, sans-serif" 
        font-size="14" 
        font-weight="bold"
        letter-spacing="4"
        fill="#AA66FF">— EST. 2025 —</text>
</svg>
