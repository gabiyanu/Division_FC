<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="crestBg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E2A38"/>
      <stop offset="100%" style="stop-color:#0F1419"/>
    </linearGradient>
    <linearGradient id="brightAurora1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFD4"/>
      <stop offset="50%" style="stop-color:#BF5FFF"/>
      <stop offset="100%" style="stop-color:#FF6EB4"/>
    </linearGradient>
    <linearGradient id="brightCyan1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFD4"/>
      <stop offset="100%" style="stop-color:#00D4AA"/>
    </linearGradient>
    <linearGradient id="brightMagenta1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6EB4"/>
      <stop offset="100%" style="stop-color:#FF3D9A"/>
    </linearGradient>
    <filter id="glowBright1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Arsenal-style crest -->
  <path d="M200 8 
           L380 55 
           L380 300 
           L200 472 
           L20 300 
           L20 55 Z" 
        fill="url(#crestBg1)" 
        stroke="url(#brightAurora1)" 
        stroke-width="5"/>
  
  <!-- Inner border -->
  <path d="M200 28 
           L360 70 
           L360 290 
           L200 448 
           L40 290 
           L40 70 Z" 
        fill="none" 
        stroke="#2A3A4A" 
        stroke-width="2"/>
  
  <!-- Top banner area -->
  <path d="M40 70 L360 70 L360 105 L40 105 Z" 
        fill="#00FFD4" 
        opacity="0.15"/>
  
  <!-- DIVISION text at top -->
  <text x="200" y="95" 
        text-anchor="middle" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="30" 
        font-weight="900"
        letter-spacing="3"
        fill="#00FFD4"
        filter="url(#glowBright1)">DIVISION</text>
  
  <!-- TOP EYE -->
  <g transform="translate(200, 160)">
    <ellipse cx="0" cy="0" rx="60" ry="34" fill="none" stroke="#00FFD4" stroke-width="2" opacity="0.4" filter="url(#glowBright1)"/>
    <ellipse cx="0" cy="0" rx="52" ry="28" fill="#0A1015" stroke="url(#brightCyan1)" stroke-width="4"/>
    <circle cx="0" cy="0" r="18" fill="#BF5FFF"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#00FFD4" stroke-width="2"/>
    <circle cx="0" cy="0" r="9" fill="#0A1015"/>
    <circle cx="-5" cy="-5" r="4" fill="#FFFFFF"/>
    <circle cx="4" cy="3" r="2" fill="#FFFFFF" opacity="0.7"/>
  </g>
  
  <!-- DIVISION BAR -->
  <rect x="75" y="230" width="250" height="12" rx="6" fill="url(#brightAurora1)"/>
  <rect x="75" y="230" width="250" height="12" rx="6" fill="url(#brightAurora1)" filter="url(#glowBright1)" opacity="0.5"/>
  
  <!-- BOTTOM EYE -->
  <g transform="translate(200, 300)">
    <ellipse cx="0" cy="0" rx="60" ry="34" fill="none" stroke="#FF6EB4" stroke-width="2" opacity="0.4" filter="url(#glowBright1)"/>
    <ellipse cx="0" cy="0" rx="52" ry="28" fill="#0A1015" stroke="url(#brightMagenta1)" stroke-width="4"/>
    <circle cx="0" cy="0" r="18" fill="#BF5FFF"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#FF6EB4" stroke-width="2"/>
    <circle cx="0" cy="0" r="9" fill="#0A1015"/>
    <circle cx="-5" cy="-5" r="4" fill="#FFFFFF"/>
    <circle cx="4" cy="3" r="2" fill="#FFFFFF" opacity="0.7"/>
  </g>
  
  <!-- FC text -->
  <text x="200" y="370" 
        text-anchor="middle" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="32" 
        font-weight="900"
        letter-spacing="12"
        fill="#FF6EB4"
        filter="url(#glowBright1)">FC</text>
  
  <!-- EST 2025 - FULLY INSIDE CREST -->
  <text x="200" y="400" 
        text-anchor="middle" 
        font-family="Arial, sans-serif" 
        font-size="14" 
        font-weight="bold"
        letter-spacing="4"
        fill="#BF5FFF">EST. 2025</text>
</svg>
